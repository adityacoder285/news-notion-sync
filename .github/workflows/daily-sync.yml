name: Daily News → Notion Sync

on:
  schedule:
    # 07:00 UTC every day
    - cron: '0 7 * * *'
  # Allows running the sync manually from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    name: Sync newsdata.io → Notion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          # Required — set these under Settings → Secrets and variables → Actions
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          # Optional — reuse an existing database instead of creating one
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Optional tuning (repository variables, not secrets)
          NEWS_CATEGORIES: ${{ vars.NEWS_CATEGORIES }}
          NEWS_LANGUAGE: ${{ vars.NEWS_LANGUAGE }}
          NEWS_COUNTRY: ${{ vars.NEWS_COUNTRY }}
          MAX_ARTICLES: ${{ vars.MAX_ARTICLES }}
        run: python main.py
